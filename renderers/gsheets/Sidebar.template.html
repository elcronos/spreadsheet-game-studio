<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  body{margin:0;font:13px/1.4 "Google Sans",Roboto,Arial,sans-serif;color:#1f2328;background:#fff}
  #app{padding:12px;display:flex;flex-direction:column;gap:10px}
  h1{font-size:16px;margin:0;color:#3a5a1e}
  .note{font-size:12px;color:#4b5563;margin:0}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  select,button{font:inherit}
  .start{background:#3a7d2c;color:#fff;border:0;border-radius:6px;padding:9px 14px;font-weight:600;cursor:pointer}
  .status{font-size:12px;color:#1b5e20;min-height:16px}
  .status.err{color:#c62828}
  .stats{font:11px ui-monospace,Consolas,monospace;color:#555}
  .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(2,44px);gap:6px;justify-content:center}
  .pad button,.acts button{border:1px solid #c9d1c2;background:#f4f8f0;border-radius:8px;font-size:16px;cursor:pointer;touch-action:none;user-select:none}
  .pad button:active,.acts button:active{background:#dcebd0}
  .acts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
  .acts button{font-size:12px;padding:8px 0}
  .cmds{display:flex;gap:6px}
  .cmds button{flex:1;border:1px solid #d5d9e0;background:#fff;border-radius:6px;padding:6px 0;cursor:pointer;font-size:12px}
  .preview{position:relative;width:100%;aspect-ratio:16/9;display:none;background:#1a1410}
  kbd{background:#eee;border-radius:3px;padding:0 4px;font-size:11px}
  input[type=range]{flex:1;accent-color:#3a7d2c}
</style>
</head>
<body>
<div id="app">
  <h1>__TITLE__ (Google Sheets edition)</h1>
  <p class="note">The game is drawn in the <b>GAME</b> sheet, one cell per pixel. Edit values on the other tabs or formulas in <b>RULES</b> while you play and the game picks them up.</p>
  <div class="row"><label for="res">Cells</label>
    <select id="res" class="res"><option value="80x45" selected>80 × 45 (faster)</option><option value="160x90">160 × 90 (sharper)</option></select>
    <button class="start">▶ Start</button></div>
  <div class="status" role="status"></div>
  <div class="row"><label>Game speed</label><input class="speed" type="range" min="0.1" max="1" step="0.05" value="0.5"><span class="speedv">50%</span></div>
  <div class="pad"></div>
  <div class="acts"></div>
  <div class="cmds"></div>
  <p class="note keys"></p>
  <label class="note"><input type="checkbox" class="pvtoggle"> Show a small preview here too</label>
  <div class="preview"></div>
  <div class="stats"></div>
</div>
<script>
/*__BUNDLE__*/
</script>
</body>
</html>
