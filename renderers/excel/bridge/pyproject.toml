[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sgs-bridge"
version = "0.1.0"
description = "Spreadsheet Game Studio native spreadsheet bridge (Excel / LibreOffice Calc)"
requires-python = ">=3.10"
dependencies = ["websockets>=12", "numpy>=1.22", "openpyxl>=3.1"]

[project.optional-dependencies]
excel-windows = ["pywin32", "xlwings"]
excel-mac = ["xlwings"]
keys = ["pynput"]

[tool.setuptools]
packages = ["sgs_bridge", "sgs_bridge.sinks"]
